<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Settlers Browser</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#162017;font-family:system-ui;color:#fff;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;background:#6f9f55}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:5px;overflow:auto;padding:6px;background:#182016e8;border:1px solid #c9b875;border-radius:10px;pointer-events:auto}.r{white-space:nowrap;background:#ffffff10;padding:4px 6px;border-radius:6px;font-size:11px}.info{position:absolute;top:58px;left:8px;padding:8px 10px;background:#182016e8;border:1px solid #c9b875;border-radius:10px;font-size:11px;pointer-events:auto}.info b{display:block;font:700 15px Georgia;margin-bottom:3px}.tools{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:5px;overflow:auto;padding:6px;background:#182016e8;border:1px solid #c9b875;border-radius:10px;pointer-events:auto}button{flex:0 0 auto;min-width:62px;padding:7px 5px;border:1px solid #b9a35d;border-radius:8px;background:#455337;color:#fff;font-weight:700;font-size:9px}button.on{outline:2px solid #ffe58a}.msg{position:absolute;top:58px;right:8px;background:#182016e8;border:1px solid #c9b875;border-radius:9px;padding:8px;font-size:10px;max-width:145px}.err{position:fixed;z-index:99;top:10px;left:10px;right:10px;background:#6b2020;padding:10px;display:none}</style></head><body><canvas id="c"></canvas><div id="err" class="err"></div><div class="hud"><div id="res" class="top"></div><div class="info"><b>Settlers Browser</b><span id="quest">Expand your settlement.</span></div><div class="msg">Drag to pan · pinch to zoom<br>Tap a build button, then the map.</div><div id="tools" class="tools"></div></div><script>window.onerror=(m)=>{let e=document.getElementById('err');e.style.display='block';e.textContent='Game error: '+m};(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),D=Math.min(devicePixelRatio||1,2),TW=64,TH=32,W=32,H=32;let cam={x:innerWidth/2,y:-120,z:.82},drag=false,moved=false,last=null,sel='road',next=1,t0=performance.now();const T={road:{n:'Road',i:'🛤️',co:{stone:1}},wood:{n:'Woodcutter',i:'🪓',co:{wood:6,stone:2},mk:'logs',cy:4},mill:{n:'Sawmill',i:'🪚',co:{wood:8,stone:3},need:{logs:2},mk:'planks',cy:5},quarry:{n:'Quarry',i:'⛏️',co:{wood:5},mk:'stone',cy:5},farm:{n:'Farm',i:'🌾',co:{wood:7,stone:2},mk:'food',cy:6},house:{n:'House',i:'🏠',co:{wood:10,planks:5,stone:4}},store:{n:'Storage',i:'📦',co:{wood:10,planks:6,stone:6}},tower:{n:'Tower',i:'🏰',co:{planks:8,stone:14}}};let s={inv:{wood:100,logs:12,planks:60,stone:90,food:45},b:[],people:[],cap:200};function resize(){c.width=innerWidth*D;c.height=innerHeight*D;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();function iso(a,b){return{x:cam.x+(a-b)*TW*.5*cam.z,y:cam.y+(a+b)*TH*.5*cam.z}}function uniso(a,b){let q=(a-cam.x)/cam.z,r=(b-cam.y)/cam.z;return{x:Math.floor(r/TH+q/TW),y:Math.floor(r/TH-q/TW)}}function diamond(a,b,fill,stroke){let p=iso(a,b),w=TW*.5*cam.z,h=TH*.5*cam.z;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x+w,p.y+h);x.lineTo(p.x,p.y+h*2);x.lineTo(p.x-w,p.y+h);x.closePath();x.fillStyle=fill;x.fill();x.strokeStyle=stroke;x.lineWidth=.6;x.stroke()}function at(a,b){return s.b.find(v=>v.x===a&&v.y===b)}function afford(co){return Object.entries(co||{}).every(([k,v])=>(s.inv[k]||0)>=v)}function add(type,a,b,free=false){if(a<0||b<0||a>=W||b>=H||at(a,b))return;if(!free&&!afford(T[type].co))return;if(!free)Object.entries(T[type].co||{}).forEach(([k,v])=>s.inv[k]-=v);let o={id:next++,type,x:a,y:b,t:0};s.b.push(o);if(type!=='road')s.people.push({owner:o.id,x:a+.1,y:b+.1,p:Math.random()*6});ui()}function ui(){let q=[['wood','🪵'],['logs','🌲'],['planks','🟫'],['stone','🪨'],['food','🌾']];document.getElementById('res').innerHTML=q.map(([k,i])=>`<span class=r>${i} ${Math.floor(s.inv[k]||0)}</span>`).join('')+`<span class=r>👥 ${s.people.length}</span>`}let tb=document.getElementById('tools');Object.entries(T).forEach(([k,v])=>{let b=document.createElement('button');b.innerHTML=v.i+'<br>'+v.n;b.onclick=()=>{sel=k;[...tb.children].forEach(z=>z.classList.toggle('on',z===b))};if(k===sel)b.classList.add('on');tb.appendChild(b)});function demo(){for(let a=10;a<22;a++)add('road',a,16,true);for(let b=12;b<21;b++)add('road',16,b,true);[['wood',12,15],['mill',14,15],['quarry',18,15],['farm',19,17],['house',13,17],['house',14,17],['store',17,17],['tower',20,15]].forEach(v=>add(...v,true));let p=iso(16,16);cam.x+=innerWidth*.5-p.x;cam.y+=innerHeight*.48-p.y;ui()}function sim(dt){for(let b of s.b){let d=T[b.type];if(!d.mk)continue;b.t+=dt;if(b.t<d.cy)continue;b.t=0;if(d.need&&!Object.entries(d.need).every(([k,v])=>(s.inv[k]||0)>=v))continue;if(d.need)Object.entries(d.need).forEach(([k,v])=>s.inv[k]-=v);s.inv[d.mk]=(s.inv[d.mk]||0)+2}for(let p of s.people){p.p+=dt;let o=s.b.find(b=>b.id===p.owner);if(o){p.x=o.x+.15+Math.sin(p.p)*.35;p.y=o.y+.15+Math.cos(p.p*.8)*.25}}}function building(b){let p=iso(b.x,b.y),z=cam.z,d=T[b.type];if(b.type==='road'){diamond(b.x,b.y,'#987d54','#65533b');return}x.save();x.translate(p.x,p.y+15*z);x.fillStyle='#0004';x.beginPath();x.ellipse(0,8*z,21*z,7*z,0,0,7);x.fill();if(b.type==='farm'){x.fillStyle='#c3a44b';x.fillRect(-24*z,-3*z,48*z,16*z)}else if(b.type==='tower'){x.fillStyle='#777';x.fillRect(-13*z,-30*z,26*z,42*z);x.fillStyle='#555';for(let i=-13;i<14;i+=9)x.fillRect(i*z,-36*z,6*z,8*z)}else{x.fillStyle=b.type==='quarry'?'#77736d':b.type==='store'?'#74563a':'#9a6540';x.fillRect(-18*z,-13*z,36*z,25*z);x.fillStyle='#493526';x.beginPath();x.moveTo(-23*z,-13*z);x.lineTo(0,-29*z);x.lineTo(23*z,-13*z);x.fill();x.fillStyle='#e1c98b';x.fillRect(-4*z,-1*z,8*z,13*z)}x.restore();if(z>.65){x.fillStyle='#182016';x.font=`${10*z}px system-ui`;x.textAlign='center';x.fillText(d.n,p.x,p.y+38*z)}}function render(){x.setTransform(D,0,0,D,0,0);x.fillStyle='#5e8d4d';x.fillRect(0,0,innerWidth,innerHeight);for(let sum=0;sum<W+H;sum++)for(let a=0;a<W;a++){let b=sum-a;if(b<0||b>=H)continue;let n=Math.sin(a*.7+b*.43);diamond(a,b,n>.72?'#527c45':n<-.82?'#879071':(a+b)%2?'#79a85c':'#82ae62','#456f40');if(n>.72&&cam.z>.55){let p=iso(a,b);x.fillStyle='#285a32';x.beginPath();x.arc(p.x,p.y+10*cam.z,6*cam.z,0,7);x.fill()}}[...s.b].sort((a,b)=>a.x+a.y-b.x-b.y).forEach(building);for(let p of s.people){let q=iso(p.x,p.y);x.fillStyle='#f1d5a3';x.beginPath();x.arc(q.x,q.y+10*cam.z,3*cam.z,0,7);x.fill();x.fillStyle='#395578';x.fillRect(q.x-2.5*cam.z,q.y+13*cam.z,5*cam.z,8*cam.z)}}c.addEventListener('pointerdown',e=>{drag=true;moved=false;last={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.hypot(dx,dy)>3)moved=true;cam.x+=dx;cam.y+=dy;last={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',e=>{if(!moved){let p=uniso(e.clientX,e.clientY);add(sel,p.x,p.y)}drag=false});c.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.45,Math.min(1.7,cam.z*Math.exp(-e.deltaY*.001)))},{passive:false});let pd=0;c.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)cam.z=Math.max(.45,Math.min(1.7,cam.z*d/pd));pd=d}},{passive:false});demo();function loop(t){let dt=Math.min(.05,(t-t0)/1000);t0=t;sim(dt);render();if((t|0)%30===0)ui();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
