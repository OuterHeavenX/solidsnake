<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Settlers Browser</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#162017;color:#fff;font-family:system-ui;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;background:#6f9f55}.hud{position:fixed;inset:0;pointer-events:none}.top,.tools,.panel,.help{background:#182016e8;border:1px solid #c9b875;border-radius:10px}.top{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:5px;overflow:auto;padding:6px;pointer-events:auto}.r{white-space:nowrap;background:#ffffff10;padding:4px 6px;border-radius:6px;font-size:11px}.panel{position:absolute;top:58px;left:8px;padding:8px 10px;font-size:10px;max-width:205px}.panel b{font-size:14px}.help{position:absolute;top:58px;right:8px;padding:8px;font-size:9px;max-width:170px}.tools{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:5px;overflow:auto;padding:6px;pointer-events:auto}button{flex:0 0 auto;min-width:61px;padding:7px 5px;border:1px solid #b9a35d;border-radius:8px;background:#455337;color:#fff;font-weight:700;font-size:9px}button.on{outline:2px solid #ffe58a}.err{position:fixed;z-index:99;top:10px;left:10px;right:10px;background:#6b2020;padding:10px;display:none}</style></head><body><canvas id="c"></canvas><div id="err" class="err"></div><div class="hud"><div id="res" class="top"></div><div class="panel"><b>Settlers Browser · Flags</b><div id="status"></div></div><div class="help">🚩 Flags are logistics nodes.<br>Goods wait at flags and carriers may only use connected roads.<br><b>Build Flag</b> is now available.</div><div id="tools" class="tools"></div></div><script>window.onerror=m=>{let e=document.getElementById('err');e.style.display='block';e.textContent='Game error: '+m};(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),D=Math.min(devicePixelRatio||1,2),TW=64,TH=32,W=32,H=32;let cam={x:innerWidth/2,y:-120,z:.82},drag=0,moved=0,last,sel='road',nid=1,ng=1,nc=1,t0=performance.now();const T={road:{n:'Road',i:'🛤️',co:{stone:1}},flag:{n:'Flag',i:'🚩',co:{wood:1}},wood:{n:'Woodcutter',i:'🪓',co:{wood:6,stone:2},mk:'logs',cy:4},mill:{n:'Sawmill',i:'🪚',co:{wood:8,stone:3},mk:'planks',cy:5},quarry:{n:'Quarry',i:'⛏️',co:{wood:5},mk:'stone',cy:5},farm:{n:'Farm',i:'🌾',co:{wood:7,stone:2},mk:'food',cy:6},house:{n:'House',i:'🏠',co:{wood:10,planks:5,stone:4}},store:{n:'Storage',i:'📦',co:{wood:10,planks:6,stone:6}},tower:{n:'Tower',i:'🏰',co:{planks:8,stone:14}}};let s={inv:{wood:100,logs:0,planks:24,stone:70,food:30},b:[],goods:[],carriers:[],delivered:0,failed:0};function resize(){c.width=innerWidth*D;c.height=innerHeight*D;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();function iso(a,b){return{x:cam.x+(a-b)*TW*.5*cam.z,y:cam.y+(a+b)*TH*.5*cam.z}}function uniso(a,b){let q=(a-cam.x)/cam.z,r=(b-cam.y)/cam.z;return{x:Math.floor(r/TH+q/TW),y:Math.floor(r/TH-q/TW)}}function diamond(a,b,f,st){let p=iso(a,b),w=TW*.5*cam.z,h=TH*.5*cam.z;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+w,p.y+h);g.lineTo(p.x,p.y+h*2);g.lineTo(p.x-w,p.y+h);g.closePath();g.fillStyle=f;g.fill();g.strokeStyle=st;g.lineWidth=.6;g.stroke()}function at(a,b){return s.b.find(v=>v.x===a&&v.y===b)}function roadish(a,b){let q=at(a,b);return q&&(q.type==='road'||q.type==='flag')}function afford(co){return Object.entries(co||{}).every(([k,v])=>(s.inv[k]||0)>=v)}function adjNodes(o){let out=[],d=[[1,0],[-1,0],[0,1],[0,-1]];for(let [dx,dy]of d)if(roadish(o.x+dx,o.y+dy))out.push({x:o.x+dx,y:o.y+dy});return out}function flagFor(o){let fs=s.b.filter(b=>b.type==='flag');fs.sort((a,b)=>Math.abs(a.x-o.x)+Math.abs(a.y-o.y)-Math.abs(b.x-o.x)-Math.abs(b.y-o.y));return fs.find(f=>Math.abs(f.x-o.x)+Math.abs(f.y-o.y)===1)||null}function add(type,a,b,free=0){if(a<0||b<0||a>=W||b>=H||at(a,b))return 0;if(!free&&!afford(T[type].co))return 0;if(!free)Object.entries(T[type].co||{}).forEach(([k,v])=>s.inv[k]-=v);s.b.push({id:nid++,type,x:a,y:b,t:0,input:{logs:0}});ui();return 1}function ui(){let q=[['wood','🪵'],['logs','🌲'],['planks','🟫'],['stone','🪨'],['food','🌾']];document.getElementById('res').innerHTML=q.map(([k,i])=>`<span class=r>${i} ${s.inv[k]|0}</span>`).join('')+`<span class=r>🚩 ${s.b.filter(b=>b.type==='flag').length}</span>`;let idle=s.carriers.filter(v=>v.state==='idle').length;document.getElementById('status').innerHTML=`<br>Carriers: ${idle} idle · ${s.carriers.length-idle} busy<br>Goods at flags: ${s.goods.length}<br>Completed: ${s.delivered}<br>Unroutable attempts: ${s.failed}`};let tb=document.getElementById('tools');Object.entries(T).forEach(([k,v])=>{let b=document.createElement('button');b.innerHTML=v.i+'<br>'+v.n;b.onclick=()=>{sel=k;[...tb.children].forEach(z=>z.classList.toggle('on',z===b))};if(k===sel)b.classList.add('on');tb.appendChild(b)});function key(x,y){return x+','+y}function path(a,b){let q=[[a.x,a.y]],h=0,seen=new Set([key(a.x,a.y)]),prev=new Map(),dirs=[[1,0],[-1,0],[0,1],[0,-1]];while(h<q.length){let [x,y]=q[h++];if(x===b.x&&y===b.y){let out=[],k=key(x,y);while(k){let [px,py]=k.split(',').map(Number);out.push({x:px,y:py});k=prev.get(k)}return out.reverse()}for(let[dX,dY]of dirs){let nx=x+dX,ny=y+dY,k=key(nx,ny);if(!seen.has(k)&&roadish(nx,ny)){seen.add(k);prev.set(k,key(x,y));q.push([nx,ny])}}}return[]}function nearest(type,o){let z=s.b.filter(b=>b.type===type&&flagFor(b));z.sort((a,b)=>Math.abs(a.x-o.x)+Math.abs(a.y-o.y)-Math.abs(b.x-o.x)-Math.abs(b.y-o.y));return z[0]}function dest(kind,src){return kind==='logs'?(nearest('mill',src)||nearest('store',src)):nearest('store',src)}function spawn(kind,src){let sf=flagFor(src),d=dest(kind,src),df=d&&flagFor(d);if(!sf||!df){s.failed++;return}let route=path(sf,df);if(!route.length){s.failed++;return}s.goods.push({id:ng++,kind,x:sf.x,y:sf.y,src:src.id,dst:d.id,fromFlag:sf.id,toFlag:df.id,route,carrier:null})}function ensureCarriers(){let fs=s.b.filter(b=>b.type==='flag');while(s.carriers.length<3&&fs.length){let f=fs[s.carriers.length%fs.length];s.carriers.push({id:nc++,x:f.x,y:f.y,state:'idle',good:null,path:[],step:0,carry:null,speed:1.45})}}function assign(){for(let c of s.carriers){if(c.state!=='idle')continue;let item=s.goods.find(v=>!v.carrier);if(!item)break;let start={x:Math.round(c.x),y:Math.round(c.y)},pickup=s.b.find(b=>b.id===item.fromFlag),p=path(start,pickup);if(!p.length)continue;item.carrier=c.id;c.good=item.id;c.path=p;c.step=0;c.state='pickup'}}function move(c,dt){if(c.step>=c.path.length)return 1;let t=c.path[c.step],dx=t.x-c.x,dy=t.y-c.y,d=Math.hypot(dx,dy);if(d<.04){c.x=t.x;c.y=t.y;c.step++;return c.step>=c.path.length}let m=Math.min(d,c.speed*dt);c.x+=dx/d*m;c.y+=dy/d*m;return 0}function carriers(dt){assign();for(let c of s.carriers){if(c.state==='idle')continue;let item=s.goods.find(v=>v.id===c.good);if(!item){c.state='idle';continue}if(c.carry){item.x=c.x;item.y=c.y}if(!move(c,dt))continue;if(c.state==='pickup'){c.carry=item.kind;c.path=item.route;c.step=0;c.state='drop'}else{let d=s.b.find(b=>b.id===item.dst);if(d.type==='mill'&&item.kind==='logs')d.input.logs++;else s.inv[item.kind]=(s.inv[item.kind]||0)+1;s.goods=s.goods.filter(v=>v.id!==item.id);s.delivered++;c.carry=null;c.good=null;c.state='idle';c.path=[]}}}function sim(dt){for(let b of s.b){let d=T[b.type];if(!d.mk)continue;b.t+=dt;if(b.t<d.cy)continue;b.t=0;if(b.type==='mill'){if(!b.input.logs)continue;b.input.logs--;spawn('planks',b)}else spawn(d.mk,b)}carriers(dt)}function building(b){let p=iso(b.x,b.y),z=cam.z,d=T[b.type];if(b.type==='road'){diamond(b.x,b.y,'#987d54','#65533b');return}if(b.type==='flag'){diamond(b.x,b.y,'#9a845b','#65533b');g.strokeStyle='#51341f';g.lineWidth=2*z;g.beginPath();g.moveTo(p.x,p.y+20*z);g.lineTo(p.x,p.y-8*z);g.stroke();g.fillStyle='#d34135';g.beginPath();g.moveTo(p.x,p.y-8*z);g.lineTo(p.x+13*z,p.y-3*z);g.lineTo(p.x,p.y+2*z);g.fill();return}g.save();g.translate(p.x,p.y+15*z);g.fillStyle='#0004';g.beginPath();g.ellipse(0,8*z,21*z,7*z,0,0,7);g.fill();if(b.type==='farm'){g.fillStyle='#c3a44b';g.fillRect(-24*z,-3*z,48*z,16*z)}else if(b.type==='tower'){g.fillStyle='#777';g.fillRect(-13*z,-30*z,26*z,42*z)}else{g.fillStyle=b.type==='quarry'?'#77736d':b.type==='store'?'#74563a':'#9a6540';g.fillRect(-18*z,-13*z,36*z,25*z);g.fillStyle='#493526';g.beginPath();g.moveTo(-23*z,-13*z);g.lineTo(0,-29*z);g.lineTo(23*z,-13*z);g.fill();g.fillStyle='#e1c98b';g.fillRect(-4*z,-1*z,8*z,13*z)}g.restore();if(z>.65){g.fillStyle='#182016';g.font=`${10*z}px system-ui`;g.textAlign='center';g.fillText(d.n+(b.type==='mill'&&b.input.logs?' ['+b.input.logs+']':''),p.x,p.y+38*z)}}function render(){g.setTransform(D,0,0,D,0,0);g.fillStyle='#5e8d4d';g.fillRect(0,0,innerWidth,innerHeight);for(let sum=0;sum<W+H;sum++)for(let a=0;a<W;a++){let b=sum-a;if(b<0||b>=H)continue;let n=Math.sin(a*.7+b*.43);diamond(a,b,n>.72?'#527c45':n<-.82?'#879071':(a+b)%2?'#79a85c':'#82ae62','#456f40')}[...s.b].sort((a,b)=>a.x+a.y-b.x-b.y).forEach(building);for(let v of s.goods){let p=iso(v.x,v.y),z=cam.z;g.fillStyle=v.kind==='logs'?'#6f4b2b':v.kind==='planks'?'#b27a46':v.kind==='stone'?'#d2d0c8':'#e2bf47';g.fillRect(p.x-5*z,p.y+10*z,10*z,8*z)}for(let v of s.carriers){let p=iso(v.x,v.y),z=cam.z;g.fillStyle='#f3d8ad';g.beginPath();g.arc(p.x,p.y+8*z,3*z,0,7);g.fill();g.fillStyle=v.carry?'#c98c3e':'#7b3f36';g.fillRect(p.x-3*z,p.y+11*z,6*z,9*z)}}function demo(){for(let a=10;a<22;a++)add('road',a,16,1);for(let b=12;b<21;b++)add('road',16,b,1);[['flag',13,16],['flag',15,16],['flag',17,16],['flag',20,16],['flag',16,18],['wood',13,15],['mill',15,15],['quarry',17,15],['farm',20,17],['house',14,17],['store',17,18],['tower',20,15]].forEach(v=>add(...v,1));ensureCarriers();let p=iso(16,16);cam.x+=innerWidth*.5-p.x;cam.y+=innerHeight*.48-p.y;ui()}c.addEventListener('pointerdown',e=>{drag=1;moved=0;last={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.hypot(dx,dy)>3)moved=1;cam.x+=dx;cam.y+=dy;last={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',e=>{if(!moved){let p=uniso(e.clientX,e.clientY);add(sel,p.x,p.y);ensureCarriers()}drag=0});c.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.45,Math.min(1.7,cam.z*Math.exp(-e.deltaY*.001)))},{passive:false});demo();function loop(t){let dt=Math.min(.05,(t-t0)/1000);t0=t;sim(dt);render();if((t|0)%30===0)ui();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
