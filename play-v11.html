<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>Settlers Play v11</title><link rel="stylesheet" href="styles.css?v=play11"><style>#buildbar{position:fixed;z-index:8;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:7px;overflow-x:auto;padding:8px;background:#172117eF;border:2px solid #cdb873;border-radius:16px}#buildbar button{flex:0 0 auto;min-width:78px;padding:12px 9px;background:#394432;color:#fff;border:1px solid #cdb873;border-radius:12px;font-weight:700}#buildbar button.sel{outline:3px solid #ffe28a;background:#59623b}</style></head><body><canvas id="c"></canvas><div id="err" class="err"></div><div class="hud"><div id="res" class="top"></div><div class="panel"><b>Settlers Browser · Player Build v11</b><div id="status"></div></div><div class="help">👆 Pick a build button, then tap terrain.<br>🛣️ Roads + 🚩 flags appear immediately.<br>🏗️ Buildings become construction sites.<br>📦 Materials must travel through YOUR flag network.<br>👷 Builder finishes supplied sites.</div></div><div id="buildbar"><button data-build="road">🛣️ Road</button><button data-build="flag">🚩 Flag</button><button data-build="house">🏠 House</button><button data-build="wood">🪓 Woodcutter</button><button data-build="mill">🪚 Sawmill</button><button data-build="quarry">⛏️ Quarry</button><button data-build="farm">🌾 Farm</button></div><script type="module" src="src/main-v11.js"></script><script>addEventListener('error',e=>{const x=document.querySelector('#err');x.style.display='block';x.textContent='v11 error: '+e.message})</script></body></html>
